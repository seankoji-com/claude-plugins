name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check no Python cache artifacts are tracked
        run: |
          if git ls-files | grep -qE '(__pycache__/|\.pyc$|\.ruff_cache/)'; then
            echo "ERROR: Python cache artifacts found in tracked files"
            git ls-files | grep -E '(__pycache__/|\.pyc$|\.ruff_cache/)'
            exit 1
          fi
          echo "No Python cache artifacts tracked"

      - name: Validate marketplace manifest
        run: |
          jq empty .claude-plugin/marketplace.json
          echo "marketplace.json is valid JSON"

      - name: Validate all plugin manifests
        run: |
          for plugin_json in plugins/*/.claude-plugin/plugin.json; do
            echo "Checking $plugin_json..."
            jq empty "$plugin_json"
            name=$(jq -r '.name // empty' "$plugin_json")
            [ -n "$name" ] || { echo "ERROR: missing name in $plugin_json"; exit 1; }
            has_commands=$(jq 'has("commands")' "$plugin_json")
            [ "$has_commands" = "false" ] || { echo "ERROR: plugin.json must not have commands field: $plugin_json"; exit 1; }
            version=$(jq -r '.version // empty' "$plugin_json")
            [ -n "$version" ] || { echo "ERROR: missing version in $plugin_json"; exit 1; }
            echo "  OK: $plugin_json (name=$name version=$version)"
          done

      - name: Validate manifests against JSON Schema contracts
        run: |
          pipx run check-jsonschema --schemafile schemas/marketplace.schema.json .claude-plugin/marketplace.json
          for plugin_json in plugins/*/.claude-plugin/plugin.json; do
            echo "Schema-checking $plugin_json..."
            pipx run check-jsonschema --schemafile schemas/plugin.schema.json "$plugin_json"
          done

      - name: Install PyYAML for frontmatter validation
        run: python3 -m pip install --user --break-system-packages pyyaml==6.0.2

      - name: Validate command/agent frontmatter against JSON Schema contracts
        run: |
          fail=0
          workdir=$(mktemp -d)

          # Extracts the YAML frontmatter block (between the first pair of '---'
          # lines) from a command/agent markdown file, parses it with pyyaml, and
          # re-dumps it to a standalone .yaml file so check-jsonschema can validate
          # it like any other YAML instance. Single-line python3 -c (no heredoc) so
          # the script's own indentation can't collide with this block's.
          check_frontmatter() {
            md="$1"
            schema="$2"
            fm="$workdir/$(echo "$md" | tr '/' '_').yaml"
            if ! python3 -c "import sys, yaml; text = open(sys.argv[1], encoding='utf-8').read(); assert text.startswith('---\n'), 'no frontmatter start'; end = text.find('\n---', 4); assert end != -1, 'no frontmatter end'; data = yaml.safe_load(text[4:end]); assert isinstance(data, dict), 'frontmatter must be a mapping'; yaml.safe_dump(data, open(sys.argv[2], 'w'))" "$md" "$fm"; then
              echo "ERROR: $md has no parseable '---' frontmatter block"
              return 1
            fi
            echo "Schema-checking $md frontmatter..."
            pipx run check-jsonschema --schemafile "$schema" "$fm"
          }

          for md in plugins/*/commands/*.md; do
            [ -f "$md" ] || continue
            check_frontmatter "$md" schemas/command-frontmatter.schema.json || fail=1
          done

          for md in plugins/*/agents/*.md; do
            [ -f "$md" ] || continue
            check_frontmatter "$md" schemas/agent-frontmatter.schema.json || fail=1
          done

          [ "$fail" = "0" ] || exit 1
          echo "All command/agent frontmatter valid"

      - name: Check every plugin has a README and is listed in the root README
        run: |
          fail=0
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            [ -f "${plugin_dir}README.md" ] || { echo "ERROR: missing plugins/${plugin_name}/README.md"; fail=1; }
            grep -q "(\./plugins/${plugin_name}/)" README.md || { echo "ERROR: $plugin_name not listed in root README.md 'Available plugins' table"; fail=1; }
          done
          [ "$fail" = "0" ] || exit 1
          echo "All plugins have READMEs and are listed in the root README"

      - name: Validate marketplace name-to-source consistency
        run: |
          jq -r '.plugins[] | "\(.name) \(.source)"' .claude-plugin/marketplace.json | while IFS=" " read -r name source; do
            manifest="${source}/.claude-plugin/plugin.json"
            [ -f "$manifest" ] || { echo "ERROR: source dir missing for $name: $manifest"; exit 1; }
            actual_name=$(jq -r '.name' "$manifest")
            [ "$actual_name" = "$name" ] || { echo "ERROR: name mismatch: marketplace='$name' manifest='$actual_name'"; exit 1; }
            echo "OK: $name -> $source"
          done

      - name: Validate every plugin is registered in marketplace.json
        run: |
          manifest_names=$(for plugin_json in plugins/*/.claude-plugin/plugin.json; do jq -r '.name' "$plugin_json"; done | sort)
          marketplace_names=$(jq -r '.plugins[].name' .claude-plugin/marketplace.json | sort)
          diff -u <(printf '%s\n' "$manifest_names") <(printf '%s\n' "$marketplace_names")

      - name: Validate marketplace versions match plugin.json
        run: |
          jq -r '.plugins[] | "\(.name) \(.source) \(.version // "")"' .claude-plugin/marketplace.json | \
          while IFS=" " read -r name source market_version; do
            [ -n "$market_version" ] || { echo "ERROR: marketplace entry for '$name' is missing version"; exit 1; }
            manifest="${source}/.claude-plugin/plugin.json"
            plugin_version=$(jq -r '.version' "$manifest")
            [ "$market_version" = "$plugin_version" ] || {
              echo "ERROR: version mismatch for $name: marketplace=$market_version plugin.json=$plugin_version"
              exit 1
            }
            echo "OK: $name@$market_version"
          done

      - name: Validate version bumped for changed plugins (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            manifest="${plugin_dir}.claude-plugin/plugin.json"
            [ -f "$manifest" ] || continue

            if ! git diff --quiet "$BASE_SHA" HEAD -- "$plugin_dir"; then
              base_version=$(git show "$BASE_SHA:$manifest" 2>/dev/null | jq -r '.version // "0.0.0"')
              current_version=$(jq -r '.version' "$manifest")

              if [ "$current_version" = "$base_version" ]; then
                echo "ERROR: $plugin_name changed but version not bumped (still $current_version)"
                failed=1
              else
                echo "OK: $plugin_name bumped $base_version -> $current_version"
              fi
            fi
          done
          [ "$failed" = "0" ] || exit 1

      - name: Check shell and python scripts are executable
        run: |
          # git ls-files -s emits: "<mode> <object> <stage>\t<path>" — path is tab-separated.
          while IFS=$'\t' read -r meta path; do
            mode=${meta%% *}
            [ "$mode" = "100755" ] || { echo "ERROR: $path not executable (mode $mode)"; exit 1; }
            echo "OK executable: $path"
          done < <(git ls-files -s 'plugins/**/*.sh' 'plugins/**/*.py')
          echo "All .sh and .py scripts are executable"

      - name: Shellcheck all shipped shell scripts
        # info-level notes are advisory; warning+ blocks
        run: find plugins -name "*.sh" -exec shellcheck --severity=warning {} +

      - name: node --check all shipped Workflow scripts
        run: |
          for f in plugins/*/scripts/*.js; do
            [ -f "$f" ] || continue
            echo "Checking $f..."
            node --check "$f"
          done

      - name: python3 --check all shipped Python scripts
        # Syntax-checks every plugins/*/scripts/*.py file (all plugins, not just imps)
        run: |
          for f in plugins/*/scripts/*.py; do
            [ -f "$f" ] || continue
            echo "Checking $f..."
            python3 -m py_compile "$f"
          done

      - name: Contract names agree across imps files
        run: |
          fail=0
          check() { grep -qF -- "$2" "$1" || { echo "MISSING: $2 in $1"; fail=1; }; }
          # Identifier check: the token must appear as a WHOLE token, not as a prefix of a
          # longer one. A plain `grep -F operator-overridden` is satisfied by
          # `operator-overridden-adjudication-error`, so the version of this step that used -F
          # for identifiers passed a fifth ruling value straight through the check whose entire
          # job is pinning that enum at four. \b is useless here (ERE treats `-` as a word
          # boundary), hence the explicit neighbour class.
          B='[^A-Za-z0-9_-]'
          check_token() {
            grep -qE -- "(^|$B)$2($B|\$)" "$1" || { echo "MISSING (as a whole token): $2 in $1"; fail=1; }
          }
          W=plugins/imps/scripts/imps-run.workflow.js
          C=plugins/imps/commands/imps.md
          A=plugins/imps/agents/imp-agency.md
          for n in parked_findings wontfix_rulings verdicts_pending unresolved_findings \
                   parked-contestable parked-deferred load-bearing operator-overridden; do
            check_token "$W" "$n"; check_token "$C" "$n"
          done
          # The ruling vocabulary is closed at four. A presence check cannot catch a FIFTH value
          # being coined, so assert the closure directly: every `ruling: '<value>'` the script
          # assigns must be one of the four. Scoped to actual assignments, not prose — matching
          # any hyphenated word would flag comments ("operator-facing") and patchState labels
          # ("parked-findings-write-error"), which is how a broader version of this check became
          # unusable noise.
          undeclared=$(grep -oE "ruling: '[a-z-]+'" "$W" \
            | sed -E "s/ruling: '([a-z-]+)'/\1/" | sort -u \
            | grep -vxE 'parked-contestable|parked-deferred|load-bearing|operator-overridden' || true)
          if [ -n "$undeclared" ]; then
            echo "UNDECLARED ruling value(s) assigned in $W (the vocabulary is closed at four):"
            echo "$undeclared"
            fail=1
          fi
          for v in 'override findings:' 'retry findings'; do check "$W" "$v"; check "$C" "$v"; done
          for f in "$C" "$A"; do check "$f" '## Global Constraints'; check "$f" '## Parked findings'; done
          # $W is the file that actually depends on both section names at runtime — the
          # constraints pointer reads "Global Constraints" as a quoted section name (never as
          # markdown heading syntax, since the open-model sandbox can't follow a pointer to
          # read the literal "## " heading), while writeParkedFindings() locates its section
          # by the literal markdown heading "## Parked findings". Check each in the form $W
          # actually uses, not the docs' "## " form for both.
          check "$W" 'Global Constraints'; check "$W" '## Parked findings'
          [ "$fail" = 0 ]

      - name: Check for bundled-asset path leaks
        run: |
          # Structural rule (not a hardcoded allowlist): any file shipped inside a
          # plugin's own non-commands directories (scripts/, personas/, etc.) is a
          # bundled asset that must be resolved via ${CLAUDE_PLUGIN_ROOT} at runtime,
          # never hardcoded under ~/.claude/. Build the set of bundled-asset basenames
          # across every plugin, then flag any commands/*.md that references one of
          # them under a literal ~/.claude/ path.
          fail=0
          assets=$(find plugins/*/* -maxdepth 0 -type d 2>/dev/null \
            | grep -Ev '/(commands|\.claude-plugin)$' \
            | xargs -I{} find {} -type f 2>/dev/null \
            | xargs -n1 basename \
            | sed 's/\.[^.]*$//' \
            | sort -u)

          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            cmd_dir="${plugin_dir}commands"
            [ -d "$cmd_dir" ] || continue
            for asset in $assets; do
              # Escape ERE metacharacters in the asset basename before interpolating it
              # into the pattern — an unescaped '.', '*', etc. would match too loosely.
              asset_re=$(printf '%s' "$asset" | sed 's/[.[\*^$()+?{|]/\\&/g')
              # Require a path boundary around the asset name so e.g. asset "imp" doesn't
              # false-positive on unrelated "~/.claude/imps/..." runtime-state paths.
              hits=$(grep -rn --include="*.md" -E "~/\.claude/([^)\`[:space:]]*/)?${asset_re}(\.[A-Za-z0-9]+)?([^A-Za-z0-9_-]|\$)" "$cmd_dir" 2>/dev/null || true)
              if [ -n "$hits" ]; then
                echo "ERROR: bundled-asset path leak in $plugin_name referencing '$asset' (use \${CLAUDE_PLUGIN_ROOT} instead):"
                echo "$hits"
                fail=1
              fi
            done
          done
          [ "$fail" = "0" ] || exit 1
          echo "No bundled-asset path leaks"

  behavioral-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests/run.sh
        run: bash tests/run.sh

      - name: Run tests/run-python.sh
        run: bash tests/run-python.sh

      - name: Run tests/run-js.sh
        run: bash tests/run-js.sh
  macos-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Confirm Bash version
        run: bash --version

      - name: Bash syntax check all shipped scripts (Bash 3.2 target)
        # These scripts target macOS system Bash 3.2; `bash -n` is a syntax-only
        # parse (no execution) and catches Bash 4+ constructs that would break on
        # the oldest supported interpreter.  The full behavioral test harness
        # (tests/run.sh) requires Bash 4+ and runs in the `behavioral-tests` job
        # on ubuntu-latest — this job only verifies that shipped scripts parse
        # under the oldest supported Bash.
        run: |
          set -e
          for f in plugins/*/scripts/*.sh; do
            echo "  bash -n $f"
            bash -n "$f"
          done
          echo "All shipped scripts parse under $(bash --version | head -1)"

  # Regenerates dist/opencode and dist/agy from the committed sources on a clean
  # ubuntu-latest checkout and fails if the result differs from what's committed. This
  # is also the cross-machine determinism check: generate.py is required to produce a
  # byte-identical dist/ regardless of the OS/filesystem it runs on (see the "Generator
  # determinism" constraint in the run's Global Constraints — sorted() enumeration,
  # sort_keys json.dump, newline="\n" everywhere), and ubuntu-latest is a different
  # machine from every contributor's dev box by construction.
  cross-platform-regen:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 matches the `validate` job's checkout above; kept for parity and
      # because it's cheap on this repo's history, even though dist-lint.sh's
      # frozen-sources check — the one invariant here that needs origin/master — is
      # opt-in (--check-frozen-sources) and NOT part of the plain `bash build/dist-lint.sh`
      # run below. Wiring frozen-sources into this permanent push/pull_request gate would
      # compare every future, unrelated PR against a moving origin/master and reject any
      # of them that legitimately touch a command/agent/script file — see dist-lint.sh's
      # own --help text and the comment above check_frozen_sources for the full reasoning.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # --self-test proves each dist-lint invariant actually fails on a broken fixture
      # and passes on a correct one — the fail-closed guards it enforces (out-of-prefix
      # uninstall paths, frozen Claude sources, README-marker agreement, ...) had no
      # automated regression coverage anywhere in CI before this step existed; a
      # regression here previously required someone to remember to run --self-test by
      # hand. Self-contained (its own mktemp fixtures and synthetic git repos), so it
      # needs no live agy/opencode and runs before the real-repo lint below.
      - name: Prove dist-lint.sh's invariants (build/dist-lint.sh --self-test)
        run: bash build/dist-lint.sh --self-test

      # Same reasoning for install-agy.sh's fail-closed uninstall-path guard: its
      # --self-test runs entirely inside a throwaway mktemp -d prefix (never the real
      # install location) and needs no live `agy` binary — see its own --self-test
      # implementation for both guarantees.
      - name: Prove install-agy.sh's fail-closed guard (install-agy.sh --self-test)
        run: bash install-agy.sh --self-test

      # dist-lint runs FIRST, against the pristine checkout. Its regen-diff invariant
      # generates into its own mktemp and compares both directions against the *committed*
      # dist/ — that signal is destroyed once `generate.py` has overwritten dist/ in place.
      # Deliberately NOT --check-frozen-sources: see the checkout step's comment above.
      - name: Lint the committed dist/ (build/dist-lint.sh)
        run: bash build/dist-lint.sh

      - name: Regenerate dist/ from committed sources (build/generate.py)
        run: python3 build/generate.py

      - name: Fail on dist/ drift between committed and freshly generated output
        run: |
          # git status --porcelain, not just `git diff --exit-code`: a regeneration that
          # emits a brand-new file (a new command added to plugins/, dist/ not
          # re-committed) leaves it *untracked*, which `git diff --exit-code` alone does
          # not see. Run both: porcelain is the primary gate (it also covers the
          # untracked case), and `git diff --exit-code -- dist` is kept alongside as a
          # second, narrower assertion over tracked files specifically — redundant with
          # porcelain by construction (nothing reaches it with porcelain already clean),
          # so it never weakens the gate, only names the tracked-file case explicitly.
          drift="$(git status --porcelain -- dist)"
          tracked_drift=0
          git diff --exit-code -- dist >/dev/null || tracked_drift=1
          if [ -n "$drift" ] || [ "$tracked_drift" = "1" ]; then
            echo "ERROR: dist/ is out of date. Run 'python3 build/generate.py' locally and commit the result." >&2
            printf '%s\n' "$drift" >&2
            git diff -- dist >&2 || true
            exit 1
          fi
