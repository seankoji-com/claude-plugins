# Public export from seankoji-com/.github; generated by scripts/render_caller.py.
# Agent Readiness — synced from seankoji-com/.github (panel/call-reusable-agent-readiness.yml)
# Ratchet on agentic token cost: reports what a PR makes worse — a new
# CLAUDE.md/AGENTS.md split, a file pushed over the line limit, a doc or
# .claude/ command now pointing at a missing path. Existing debt never fails.
# Advisory unless this repo's .agent-readiness.json sets "enforce": true.
# Standard, check list, and config: seankoji-com/.github docs/agent-readiness.md
name: Agent Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-readiness:
    # Fork heads never run: this forwards org secrets so the reusable workflow
    # can read the checker out of the private hub, and a fork PR must not
    # receive them. A skipped job is neutral to the gatekeeper.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Score merge-base and head
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          cat > "${RUNNER_TEMP}/agent_readiness.py" <<'PY'
          #!/usr/bin/env python3
          """Agent-readiness check: is this checkout cheap for a coding agent to change?

          Runs on a plain local checkout — stdlib only, no network, no token, and a
          single file on purpose: CI fetches it by raw URL into every org repo, so it
          cannot import anything else from here. What each check means, the thresholds,
          the ratchet, and the per-repo `.agent-readiness.json` config are documented in
          docs/agent-readiness.md; the check list below is the short form.

            context-split      high    CLAUDE.md and AGENTS.md coexist, neither imports the other
            context-duplicate  medium  CLAUDE.md and AGENTS.md are identical copies, not `@AGENTS.md`
            context-budget     medium  always-loaded guide (+ transitive @imports) over budget; high at 2x
            stale-commands     high    a .claude/ command, skill, or agent links to a missing path
            doc-drift          medium  a markdown link points nowhere (one finding per target)
            config-invalid     high    .agent-readiness.json unreadable; defaults used, never enforced
            path-drift         low     a backtick `path/like.this` in prose points nowhere
            monster-files      low     source file over the line limit
            tracked-blobs      low     large data file tracked in the tree
            gitattributes      low     lockfile / generated file not marked linguist-generated
            context-missing    low     real code, no agent guide
            tests-missing      low     real code, zero test lines
            nested-guides      low     monorepo package with substantial code and no guide
            tracked-scratch    low     GOAL.md, backups, editor droppings under git
            waiver-expired     low     a waiver in .agent-readiness.json is past its date

          Usage:
            agent_readiness.py [--root DIR] [--json] [--summary-md FILE] [--fail-on SEV]
            agent_readiness.py --fleet DIR                 every git repo directly under DIR
            agent_readiness.py --baseline base.json        ratchet: only new/worse/grown findings
            agent_readiness.py --ci                        PR mode: merge-base ratchet + gate
                                                           (reads GITHUB_BASE_REF etc.)

          Exit: 0 clean or advisory, 1 findings at/above --fail-on (only when the repo
          sets "enforce": true under --gate/--ci), 2 the check could not run.
          """

          from __future__ import annotations

          import argparse
          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from dataclasses import asdict, dataclass, field, replace
          from datetime import date
          from pathlib import Path

          SEV_ORDER = {"critical": 0, "high": 1, "medium": 2, "low": 3, "info": 4}

          DEFAULT_CONFIG: dict = {
              "enforce": False,              # findings fail CI only when a repo opts in
              "context_budget_tokens": 4000, # always-loaded instruction text, chars/4
              "max_code_lines": 800,
              "max_test_lines": 1500,
              "growth_tolerance": 0.10,      # metric growth allowed before it is a regression
              "blob_lines": 3000,
              "blob_bytes": 512 * 1024,
              "min_source_files": 50,        # smaller repos are skipped unless "always"
              "always": False,
              "min_code_lines_for_guide": 300,
              "min_code_lines_for_tests": 500,
              "ignore": [],                  # posix globs no check looks at
              "waivers": [],                 # [{check, subject glob, until YYYY-MM-DD, reason}]
          }
          CONFIG_FILE = ".agent-readiness.json"
          METRIC_CHECKS = {"monster-files", "context-budget"}

          CODE_EXT = {
              ".py", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".sh", ".bash", ".zsh",
              ".go", ".rs", ".rb", ".swift", ".kt", ".kts", ".java", ".cs", ".php", ".lua",
              ".sql", ".css", ".scss", ".vue", ".svelte", ".astro", ".c", ".cc", ".cpp",
              ".h", ".hpp", ".m", ".mm", ".dart", ".ex", ".exs", ".scala", ".pl", ".r",
              ".jl", ".zsh-theme",
          }
          DATA_EXT = {".json", ".yml", ".yaml", ".toml", ".md", ".html", ".csv", ".txt",
                      ".xml", ".svg", ".tsv", ".ndjson", ".jsonl"}
          LOCKFILES = {
              "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "poetry.lock",
              "Cargo.lock", "uv.lock", "Gemfile.lock", "composer.lock", "bun.lockb",
              "go.sum", "Pipfile.lock", "flake.lock",
          }
          SKIP_DIR_NAMES = {
              ".git", "node_modules", "vendor", "third_party", "dist", "build", "out",
              ".next", ".nuxt", ".output", ".svelte-kit", "coverage", "__pycache__",
              ".venv", "venv", ".turbo", ".cache", ".wrangler", "generated",
              "__generated__", ".pnpm-store", "target", "Pods", "DerivedData",
          }
          SKIP_PATH_PREFIXES = (".claude/worktrees/", ".opencode/worktrees/")
          # Not `.d.ts`: hand-written ambient declarations are source, and a generated
          # one usually lives under a dist/ or generated/ directory that is skipped anyway.
          GENERATED_FILE_RE = re.compile(
              r"(\.min\.(js|css)$|[._]pb\.(js|ts|py)$|\.generated\.|\.bundle\.js$)"
          )
          TEST_PATH_RE = re.compile(
              r"(^|/)(tests?|__tests__|spec|specs|e2e|Tests|__mocks__|fixtures)(/|$)"
              r"|\.(test|spec)\.[a-z]+$|_test\.[a-z]+$|(^|/)test_[^/]*\.py$|Tests?\.swift$"
              r"|\.bats$"
          )
          SCRATCH_RE = re.compile(
              r"(^|/)(GOAL\.md|\.DS_Store|Thumbs\.db|.*\.(bak|orig|rej|swp)|.*~|.*_VERIFY\.txt)$"
          )
          CHANGELOG_RE = re.compile(r"(^|/)(changelog|history|releases?)(\.d/|[^/]*\.md$)", re.I)
          # Docs under these describe what WAS and legitimately name files that are gone.
          ARCHIVE_DIR_RE = re.compile(r"(^|/)(archive|archives|legacy|deprecated|superseded)/", re.I)
          IMPORT_RE = re.compile(r"^@([\w./~-]+)\s*$", re.M)
          MD_LINK_RE = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          BACKTICK_PATH_RE = re.compile(r"`([\w.-]+(?:/[\w.\-]+)+\.[a-zA-Z0-9]{1,8})`")
          PACKAGE_PARENTS = ("apps", "packages", "services", "workers", "libs")
          AGENTIC_PREFIXES = (".claude/", ".github/skills/", ".agents/", ".opencode/")


          @dataclass
          class Finding:
              check: str
              severity: str
              subject: str        # stable identity for the ratchet — never a count
              message: str
              repo: str = ""
              metric: int | None = None   # lines or tokens, compared by the ratchet
              blocked: bool = False

              @property
              def key(self) -> str:
                  return f"{self.repo}|{self.check}|{self.subject}"


          @dataclass
          class RepoReport:
              repo: str
              findings: list[Finding] = field(default_factory=list)
              stats: dict = field(default_factory=dict)
              enforce: bool = False
              skipped: str = ""
              tolerance: float = DEFAULT_CONFIG["growth_tolerance"]

              @property
              def blocked(self) -> bool:
                  return any(f.blocked for f in self.findings)

              @property
              def status(self) -> str:
                  if self.skipped:
                      return "skipped"
                  if self.blocked:
                      return "error"
                  return "fail" if self.findings else "pass"


          # ── Repo model ────────────────────────────────────────────────────────────


          class Repo:
              """Tracked files of one checkout, with the config that applies to it."""

              def __init__(self, root: Path, name: str | None = None):
                  self.root = root.resolve()
                  self.name = name or self.root.name
                  self.config = dict(DEFAULT_CONFIG)
                  self.config_error = ""
                  cfg = self.root / CONFIG_FILE
                  if cfg.is_file():
                      try:
                          loaded = json.loads(cfg.read_text(encoding="utf-8"))
                          if not isinstance(loaded, dict):
                              raise ValueError("top level is not an object")
                          self.config.update(loaded)
                      except (OSError, ValueError) as exc:
                          # Defaults, never enforce: a broken config must not red-light
                          # a repo that cannot say whether it opted in.
                          self.config_error = str(exc)
                          self.config["enforce"] = False
                  self.all_tracked = self._git_ls_files()
                  if not self.all_tracked and (self.root / ".git").exists():
                      # An empty listing is indistinguishable from a tiny repo and would
                      # skip as green; a real checkout always tracks something.
                      raise RuntimeError("git ls-files returned nothing")
                  self.files = sorted(f for f in self.all_tracked if not self.is_ignored(f))
                  self.top_dirs = {f.split("/", 1)[0] for f in self.files if "/" in f}
                  self._lines: dict[str, int] = {}

              def git(self, *args: str, inp: bytes | None = None) -> bytes:
                  try:
                      return subprocess.run(
                          ["git", "-C", str(self.root), *args],
                          capture_output=True, check=True, timeout=120, input=inp,
                      ).stdout
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired,
                          FileNotFoundError) as exc:
                      raise RuntimeError(f"git {args[0]} failed in {self.root}: {exc}") from exc

              def _git_ls_files(self) -> list[str]:
                  files = []
                  for raw in self.git("ls-files", "-z", "--cached").split(b"\0"):
                      if not raw:
                          continue
                      f = raw.decode("utf-8", "surrogateescape")
                      p = self.root / f
                      if not p.is_symlink() and p.is_file():
                          files.append(f)
                  return files

              def is_config_ignored(self, rel: str) -> bool:
                  return any(fnmatch.fnmatch(rel, g) or fnmatch.fnmatch(rel, g.rstrip("/") + "/*")
                             for g in self.config.get("ignore", []))

              def is_ignored(self, rel: str) -> bool:
                  parts = rel.split("/")
                  if any(part in SKIP_DIR_NAMES for part in parts[:-1]) or rel.startswith(SKIP_PATH_PREFIXES):
                      return True
                  if parts[-1] in LOCKFILES or GENERATED_FILE_RE.search(parts[-1]):
                      return True
                  return self.is_config_ignored(rel)

              def lines(self, rel: str) -> int:
                  if rel not in self._lines:
                      try:
                          with open(self.root / rel, "rb") as fh:
                              self._lines[rel] = sum(1 for _ in fh)
                      except OSError:
                          self._lines[rel] = 0
                  return self._lines[rel]

              def text(self, rel: str) -> str:
                  try:
                      return (self.root / rel).read_text(encoding="utf-8", errors="replace")
                  except OSError:
                      return ""

              def exists(self, rel: str) -> bool:
                  return (self.root / rel).exists()

              def is_gitignored(self, rel: str) -> bool:
                  res = subprocess.run(["git", "-C", str(self.root), "check-ignore", "-q", "--", rel],
                                       capture_output=True, timeout=30)
                  return res.returncode == 0

              @staticmethod
              def is_test(rel: str) -> bool:
                  return bool(TEST_PATH_RE.search(rel))

              def code_files(self) -> list[str]:
                  return [f for f in self.files if Path(f).suffix.lower() in CODE_EXT]

              def source_files(self) -> list[str]:
                  return [f for f in self.files if Path(f).suffix.lower() in CODE_EXT | DATA_EXT]


          def est_tokens(text: str) -> int:
              return len(text) // 4


          # ── Context files ─────────────────────────────────────────────────────────


          def loaded_context(repo: Repo, guide: str) -> tuple[int, list[str]]:
              """Tokens a harness loads from `guide` plus its transitive @imports."""
              seen: list[str] = []
              total = 0

              def visit(rel: str) -> None:
                  if rel in seen or not repo.exists(rel) or len(seen) > 50:
                      return
                  seen.append(rel)
                  nonlocal total
                  text = repo.text(rel)
                  total += est_tokens(text)
                  for imp in IMPORT_RE.findall(text):
                      if not imp.startswith(("~", "/")):  # home-dir imports are the user's
                          visit(os.path.normpath((Path(rel).parent / imp).as_posix()))

              visit(guide)
              return total, seen


          def guide_dirs(repo: Repo) -> dict[str, dict[str, str]]:
              """Every directory holding CLAUDE.md and/or AGENTS.md → {name: relpath}."""
              dirs: dict[str, dict[str, str]] = {}
              for f in repo.files:
                  name = Path(f).name
                  if name in ("CLAUDE.md", "AGENTS.md"):
                      dirs.setdefault(Path(f).parent.as_posix(), {})[name] = f
              return dirs


          def check_context(repo: Repo) -> list[Finding]:
              out: list[Finding] = []
              budget = int(repo.config["context_budget_tokens"])
              for d, guides in sorted(guide_dirs(repo).items()):
                  label = "root" if d == "." else d
                  claude, agents = guides.get("CLAUDE.md"), guides.get("AGENTS.md")
                  if claude and agents:
                      ctext, atext = repo.text(claude), repo.text(agents)
                      imports_agents = any(Path(i).name == "AGENTS.md" for i in IMPORT_RE.findall(ctext))
                      if ctext == atext:
                          out.append(Finding(
                              "context-duplicate", "medium", label,
                              f"{label}: CLAUDE.md and AGENTS.md are identical copies "
                              f"({est_tokens(ctext)} tokens each) — make CLAUDE.md `@AGENTS.md`",
                          ))
                      elif not imports_agents:
                          out.append(Finding(
                              "context-split", "high", label,
                              f"{label}: CLAUDE.md ({est_tokens(ctext)} tok) and AGENTS.md "
                              f"({est_tokens(atext)} tok) differ and neither imports the other "
                              f"— each harness sees half the rules",
                          ))
                  primary = claude or agents
                  if primary:
                      tokens, chain = loaded_context(repo, primary)
                      sev = "high" if tokens > 2 * budget else "medium" if tokens > budget else None
                      if sev:
                          out.append(Finding(
                              "context-budget", sev, label,
                              f"{label}: always-loaded context is ~{tokens} tokens "
                              f"(budget {budget}) across {', '.join(chain)} — move reference "
                              f"material to docs/ and link it by path",
                              metric=tokens,
                          ))
              return out


          # ── Files ─────────────────────────────────────────────────────────────────


          def check_files(repo: Repo) -> tuple[list[Finding], dict]:
              out: list[Finding] = []
              cfg = repo.config
              code_lines = test_lines = 0
              for f in repo.files:
                  ext = Path(f).suffix.lower()
                  if ext in CODE_EXT:
                      n = repo.lines(f)
                      is_test = repo.is_test(f)
                      code_lines += n
                      test_lines += n if is_test else 0
                      limit = int(cfg["max_test_lines"] if is_test else cfg["max_code_lines"])
                      if n > limit:
                          out.append(Finding(
                              "monster-files", "low", f,
                              f"{f}: {n} lines (limit {limit}) — split along its seams", metric=n,
                          ))
                  elif ext in DATA_EXT and not (ext == ".md" and CHANGELOG_RE.search(f)):
                      try:
                          size = (repo.root / f).stat().st_size
                      except OSError:
                          continue
                      if size > int(cfg["blob_bytes"]) or (size > 64 * 1024 and repo.lines(f) > int(cfg["blob_lines"])):
                          out.append(Finding(
                              "tracked-blobs", "low", f,
                              f"{f}: {size // 1024} KB tracked data — keep it out of the tree, "
                              f"or list it under `ignore` in {CONFIG_FILE} if it must stay",
                          ))
                  if SCRATCH_RE.search(f):
                      out.append(Finding(
                          "tracked-scratch", "low", f,
                          f"{f}: scratch/backup file under version control — delete and gitignore",
                      ))
              stats = {"code_lines": code_lines, "test_lines": test_lines,
                       "tracked_files": len(repo.all_tracked), "source_files": len(repo.source_files())}
              dirs = guide_dirs(repo)
              if code_lines >= int(cfg["min_code_lines_for_guide"]) and "." not in dirs:
                  out.append(Finding("context-missing", "low", "root",
                                     f"no CLAUDE.md or AGENTS.md at the root of a {code_lines}-line codebase"))
              if code_lines >= int(cfg["min_code_lines_for_tests"]) and test_lines == 0:
                  out.append(Finding("tests-missing", "low", "root",
                                     f"{code_lines} code lines and no test files — nothing documents "
                                     f"behaviour an agent can run"))
              out.extend(check_nested_guides(repo, dirs))
              out.extend(check_gitattributes(repo))
              return out, stats


          def check_nested_guides(repo: Repo, dirs: dict) -> list[Finding]:
              """A session working in one monorepo package should not have to load every
              package's rules; substantial packages carry their own guide."""
              per_pkg: dict[str, int] = {}
              for f in repo.code_files():
                  parts = f.split("/")
                  if len(parts) >= 3 and parts[0] in PACKAGE_PARENTS:
                      pkg = f"{parts[0]}/{parts[1]}"
                      per_pkg[pkg] = per_pkg.get(pkg, 0) + repo.lines(f)
              return [
                  Finding("nested-guides", "low", pkg, f"{pkg}: {n} code lines and no AGENTS.md of its own")
                  for pkg, n in sorted(per_pkg.items()) if n >= 2000 and pkg not in dirs
              ]


          def check_gitattributes(repo: Repo) -> list[Finding]:
              """Lockfiles and generated files land in every diff and grep at full size
              unless .gitattributes marks them; git itself answers what is marked."""
              targets = [
                  f for f in repo.all_tracked
                  if not f.startswith(SKIP_PATH_PREFIXES) and not repo.is_config_ignored(f)
                  and (Path(f).name in LOCKFILES or GENERATED_FILE_RE.search(Path(f).name))
                  and not any(part in SKIP_DIR_NAMES for part in f.split("/")[:-1])
              ]
              if not targets:
                  return []
              raw = repo.git("check-attr", "-z", "linguist-generated", "--stdin",
                             inp=b"\0".join(t.encode("utf-8", "surrogateescape") for t in targets))
              fields = raw.split(b"\0")
              marked = {
                  fields[i].decode("utf-8", "surrogateescape")
                  for i in range(0, len(fields) - 2, 3)
                  if fields[i + 2] not in (b"unspecified", b"unset", b"false")
              }
              return [
                  Finding("gitattributes", "low", f,
                          f"{f}: lockfile/generated file not marked `linguist-generated` in "
                          f".gitattributes — add `{Path(f).name} linguist-generated -diff`")
                  for f in targets if f not in marked
              ]


          # ── Docs ──────────────────────────────────────────────────────────────────


          def resolve_ref(repo: Repo, src: str, ref: str) -> bool:
              """True when `ref` (as written in `src`) points at something that exists.
              Docs write paths relative to the file, relative to the repo root, or
              site-absolute (`/guide/x` meaning `docs-site/guide/x.md`); all three are
              tried. Anything resolving outside the repo is not ours to verify."""
              ref = ref.split("#", 1)[0]
              ref = re.sub(r":\d+(-\d+)?$", "", ref)  # path:line and path:from-to
              ref = ref.strip("<>").rstrip("/")
              if not ref or CHANGELOG_RE.search(ref):
                  return True  # empty, or a changelog fragment consumed at release
              top = src.split("/", 1)[0] if "/" in src else ""
              if ref.startswith("/"):
                  bare = ref.lstrip("/")
                  candidates = [bare, f"{top}/{bare}" if top else bare]
              else:
                  rel = os.path.normpath((Path(src).parent / ref).as_posix())
                  if rel.startswith(".."):
                      return True
                  candidates = [rel] + ([] if ref.startswith(("./", "../")) else [ref])
              if any(repo.exists(cand + sfx)
                     for cand in candidates for sfx in ("", ".md", "/README.md", "/index.md")):
                  return True
              # A gitignored path (.env, a runtime log, settings.local.json) is absent
              # on purpose; the doc is telling the reader where it will appear.
              return any(repo.is_gitignored(cand) for cand in candidates)


          def references(text: str) -> list[tuple[str, str]]:
              """(kind, ref) for every markdown link and backtick path in `text`."""
              refs: list[tuple[str, str]] = []
              for m in MD_LINK_RE.finditer(text):
                  ref = m.group(1)
                  if re.match(r"^[a-zA-Z][a-zA-Z0-9+.-]*:", ref) or ref.startswith("#"):
                      continue  # URL, mailto, or in-page anchor
                  if any(c in ref for c in "<>{}$*(") or "..." in ref:
                      continue  # placeholder, template, glob, ellipsis, or an unboundable path
                  refs.append(("link", ref))
              refs.extend(("path", m.group(1)) for m in BACKTICK_PATH_RE.finditer(text))
              return refs


          def check_docs(repo: Repo) -> list[Finding]:
              """One finding per missing target, keyed on the target alone, so the
              ratchet key never depends on how many docs point at it. Markdown links are
              an author's promise of navigability (medium; high inside .claude/); a
              backtick path in prose is often a mention of another repo or a file the
              reader is told to create, so it stays low and weekly-only."""
              broken: dict[tuple[str, str], list[tuple[str, bool]]] = {}
              for f in repo.files:
                  if not f.endswith(".md") or CHANGELOG_RE.search(f) or ARCHIVE_DIR_RE.search(f):
                      continue
                  agentic = f.startswith(AGENTIC_PREFIXES) or "/.claude/" in f
                  seen: set[str] = set()
                  for kind, ref in references(repo.text(f)):
                      if ref in seen:
                          continue
                      seen.add(ref)
                      # A bare `a/b.c` is only a claim about THIS repo when its first
                      # segment is a directory here; otherwise it names another repo.
                      if kind == "path" and ref.split("/", 1)[0] not in repo.top_dirs:
                          continue
                      if not resolve_ref(repo, f, ref):
                          broken.setdefault((kind, ref), []).append((f, agentic))
              out: list[Finding] = []
              for (kind, ref), sources in sorted(broken.items()):
                  docs = ", ".join(s for s, _ in sources[:4]) + (", …" if len(sources) > 4 else "")
                  if kind == "path":
                      check, sev = "path-drift", "low"
                  elif any(a for _, a in sources):
                      check, sev = "stale-commands", "high"
                  else:
                      check, sev = "doc-drift", "medium"
                  what = "links to" if kind == "link" else "mentions"
                  out.append(Finding(check, sev, f"→{ref}",
                                     f"`{ref}` does not exist; {docs} {what} it"
                                     + (" — an agent running this will act on a stale path"
                                        if check == "stale-commands" else "")))
              return out


          # ── Waivers, inventory, driver ────────────────────────────────────────────


          def _until(w: dict) -> date:
              try:
                  return date.fromisoformat(str(w.get("until", "")))
              except ValueError:
                  return date.min


          def apply_waivers(repo: Repo, findings: list[Finding], today: date) -> list[Finding]:
              waivers = repo.config.get("waivers") or []
              out = [
                  Finding("waiver-expired", "low", f"{w.get('check')}:{w.get('subject')}",
                          f"waiver for {w.get('check')} `{w.get('subject')}` expired {_until(w)} "
                          f"({w.get('reason', 'no reason given')})")
                  for w in waivers if _until(w) < today
              ]
              for fnd in findings:
                  if not any(w.get("check") == fnd.check and _until(w) >= today
                             and fnmatch.fnmatch(fnd.subject, str(w.get("subject", ""))) for w in waivers):
                      out.append(fnd)
              return out


          def inventory(repo: Repo) -> dict:
              """Advisory counts for the weekly report: things that inject context or
              tools into every session but are not (yet) judged by any check."""
              inv = {
                  "commands": sum(f.startswith(".claude/commands/") for f in repo.files),
                  "skills": sum(f.startswith(".claude/skills/") and f.endswith("SKILL.md") for f in repo.files),
                  "agents": sum(f.startswith(".claude/agents/") for f in repo.files),
                  "hook_files": sum(f.startswith(".claude/hooks/") for f in repo.files),
                  "mcp_servers": 0, "settings_hooks": 0,
              }
              try:
                  if repo.exists(".mcp.json"):
                      inv["mcp_servers"] = len(json.loads(repo.text(".mcp.json")).get("mcpServers", {}))
                  if repo.exists(".claude/settings.json"):
                      hooks = json.loads(repo.text(".claude/settings.json")).get("hooks", {})
                      inv["settings_hooks"] = sum(len(v) for v in hooks.values())
              except (ValueError, AttributeError):
                  pass
              return inv


          def audit_repo(root: Path, name: str | None = None, today: date | None = None) -> RepoReport:
              today = today or date.today()
              try:
                  repo = Repo(root, name)
              except RuntimeError as exc:
                  label = name or root.name
                  return RepoReport(label, [Finding("setup", "critical", "repo",
                                                    f"{label}: could not scan ({exc})", repo=label, blocked=True)])
              report = RepoReport(repo.name, enforce=bool(repo.config.get("enforce")),
                                  tolerance=float(repo.config.get("growth_tolerance", 0.10)))
              try:
                  findings = check_context(repo)
                  if repo.config_error:
                      findings.append(Finding("config-invalid", "high", CONFIG_FILE,
                                              f"{CONFIG_FILE} is unreadable ({repo.config_error}); "
                                              f"defaults applied and enforce treated as false"))
                  file_findings, stats = check_files(repo)
                  findings = apply_waivers(repo, findings + file_findings + check_docs(repo), today)
                  stats.update(inventory(repo))
              except Exception as exc:  # noqa: BLE001 - a crash must read as BLOCKED, never as clean
                  findings = [Finding("setup", "critical", "repo",
                                      f"{repo.name}: check crashed ({exc!r})", blocked=True)]
                  stats = {}
              for fnd in findings:
                  fnd.repo = repo.name
              report.stats = stats
              n_src = stats.get("source_files", 0)
              if n_src < int(repo.config["min_source_files"]) and not repo.config.get("always") \
                      and not report.blocked and not repo.config_error:
                  report.skipped = (f"{n_src} source files < {repo.config['min_source_files']} "
                                    f"(set \"always\": true to scan)")
                  return report
              report.findings = sorted(findings, key=lambda x: (SEV_ORDER[x.severity], x.check, x.subject))
              return report


          def fleet_roots(fleet: Path) -> list[Path]:
              return [d for d in sorted(fleet.iterdir())
                      if not d.name.startswith(".") and d.is_dir() and (d / ".git").exists()]


          def apply_baseline(reports: list[RepoReport], baseline: dict,
                             renames: dict[str, str] | None = None) -> list[RepoReport]:
              """Ratchet: keep findings that are new, worse, or (metric checks) grew past
              the repo's tolerance. Kept metric regressions are promoted to medium so they
              gate: a monster file is low-severity debt, but growing one is backsliding.
              `renames` maps head path → base path so a pure `git mv` of an over-limit
              file is compared with itself, not read as a new one."""
              before: dict[str, dict] = {}
              for rep in baseline.get("repos", {}).values():
                  for f in rep.get("findings", []):
                      before[f"{f.get('repo', '')}|{f['check']}|{f['subject']}"] = f
              renames = renames or {}
              out = []
              for rep in reports:
                  tol = 1.0 + rep.tolerance
                  kept = []
                  for f in rep.findings:
                      f = replace(f)  # the caller's finding is never mutated by promotion
                      base_subject = renames.get(f.subject, f.subject)
                      prev = before.get(f"{f.repo}|{f.check}|{base_subject}")
                      if f.blocked or prev is None:
                          kept.append(_promote(f) if f.check in METRIC_CHECKS else f)
                      elif SEV_ORDER[f.severity] < SEV_ORDER.get(prev.get("severity"), 9):
                          kept.append(f)
                      elif (f.check in METRIC_CHECKS and f.metric is not None
                            and prev.get("metric") is not None and f.metric > prev["metric"] * tol):
                          f.message += f" (grew from {prev['metric']} in base)"
                          kept.append(_promote(f))
                  out.append(RepoReport(rep.repo, kept, rep.stats, rep.enforce, rep.skipped))
              return out


          def _promote(f: Finding) -> Finding:
              if SEV_ORDER[f.severity] > SEV_ORDER["medium"]:
                  f.severity = "medium"
              return f


          def render_human(reports: list[RepoReport], ratchet: bool) -> str:
              lines = []
              for rep in reports:
                  mark = {"pass": "ok", "fail": "FAIL", "error": "BLOCKED", "skipped": "skip"}[rep.status]
                  st = rep.stats
                  extra = f" — {rep.skipped}" if rep.skipped else \
                      f" — {st['code_lines']} code / {st['test_lines']} test lines" if st else ""
                  mode = " [enforced]" if rep.enforce else ""
                  what = "regression(s)" if ratchet else "finding(s)"
                  lines.append(f"[{mark}] {rep.repo}{mode}: {len(rep.findings)} {what}{extra}")
                  lines.extend(f"    {f.severity:8} {f.check:18} {f.message}" for f in rep.findings)
              return "\n".join(lines)


          def render_markdown(reports: list[RepoReport], ratchet: bool) -> str:
              lines = [f"### Agent readiness{' — regressions vs base' if ratchet else ''}", ""]
              if not any(r.findings for r in reports):
                  lines.append("No regressions vs base." if ratchet else "No findings.")
              else:
                  lines += ["| repo | sev | check | detail |", "| --- | --- | --- | --- |"]
                  lines += [f"| {rep.repo} | {f.severity} | `{f.check}` | {f.message.replace('|', '&#124;')} |"
                            for rep in reports for f in rep.findings]
              for rep in reports:
                  if rep.skipped:
                      lines.append(f"\n_{rep.repo}: skipped — {rep.skipped}_")
                  elif not rep.enforce:
                      lines.append(f"\n_{rep.repo}: advisory — set `\"enforce\": true` in "
                                   f"`{CONFIG_FILE}` to gate on regressions._")
              return "\n".join(lines) + "\n"


          def to_json(reports: list[RepoReport]) -> dict:
              return {"repos": {
                  r.repo: {"status": r.status, "enforce": r.enforce, "skipped": r.skipped,
                           "stats": r.stats, "findings": [asdict(f) for f in r.findings]}
                  for r in reports
              }}


          def write_github_output(reports: list[RepoReport]) -> None:
              path = os.environ.get("GITHUB_OUTPUT")
              if not path:
                  return
              problems = "\n".join(f"{r.repo}: [{f.check}] {f.message}" for r in reports for f in r.findings)
              with open(path, "a", encoding="utf-8") as fh:
                  fh.write("PROBLEMS<<AGENT_READINESS_EOF\n" + (problems + "\n" if problems else "")
                           + "AGENT_READINESS_EOF\n")


          def exit_code(reports: list[RepoReport], fail_on: str, gate: bool) -> int:
              """A repo that could not be scanned is an error, never a pass — but under
              --gate only for repos that opted in: an advisory repo must not go red for
              a checker bug or infra failure it cannot fix in its own PR."""
              if any(r.blocked for r in reports if not gate or r.enforce):
                  return 2
              threshold = SEV_ORDER[fail_on]
              failing = any(SEV_ORDER[f.severity] <= threshold
                            for r in reports if not gate or r.enforce for f in r.findings)
              return 1 if failing else 0


          def run_ci(root: Path, fail_on: str) -> int:
              """PR mode for the reusable workflow and its public export. Scores the
              merge-base with the PR's base branch in a throwaway worktree, ratchets the
              head against it, appends the table to the step summary, and gates only for
              repos that opted in. Outside a pull_request event the report is absolute."""
              name = os.environ.get("GITHUB_REPOSITORY", "").rsplit("/", 1)[-1] or root.resolve().name
              base_ref = os.environ.get("GITHUB_BASE_REF", "")
              head = audit_repo(root, name)
              reports, ratchet = [head], False
              if base_ref:
                  # Best-effort fetch: a full-depth checkout already holds origin/<base>,
                  # and the checkout may deliberately carry no credentials — never prompt.
                  subprocess.run(["git", "-C", str(root), "fetch", "--quiet", "origin",
                                  f"+refs/heads/{base_ref}:refs/remotes/origin/{base_ref}"],
                                 timeout=300, capture_output=True,
                                 env={**os.environ, "GIT_TERMINAL_PROMPT": "0"})
                  try:
                      mb = subprocess.run(["git", "-C", str(root), "merge-base", f"origin/{base_ref}", "HEAD"],
                                          check=True, timeout=60, capture_output=True, text=True).stdout.strip()
                      renames = {}
                      for line in subprocess.run(["git", "-C", str(root), "diff", "--name-status", "-M", mb, "HEAD"],
                                                 check=True, timeout=60, capture_output=True, text=True).stdout.splitlines():
                          parts = line.split("\t")
                          if parts[0].startswith("R") and len(parts) == 3:
                              renames[parts[2]] = parts[1]  # head path → base path
                      with tempfile.TemporaryDirectory(prefix="agent-readiness-base-") as tmp:
                          wt = Path(tmp) / "base"
                          subprocess.run(["git", "-C", str(root), "worktree", "add", "--detach", "--quiet",
                                          str(wt), mb], check=True, timeout=120, capture_output=True)
                          try:
                              base = audit_repo(wt, name)
                          finally:
                              subprocess.run(["git", "-C", str(root), "worktree", "remove", "--force", str(wt)],
                                             timeout=60, capture_output=True)
                      if base.blocked:
                          print(f"::warning::base scan blocked ({base.findings[0].message})", file=sys.stderr)
                      else:
                          reports, ratchet = apply_baseline([head], to_json([base]), renames), True
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                      print(f"::warning::could not score merge-base with {base_ref} ({exc})", file=sys.stderr)
              print(render_human(reports, ratchet), file=sys.stderr)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(render_markdown(reports, ratchet))
              if base_ref and not ratchet:
                  # No ratchet means no way to tell old debt from new: report, never gate.
                  print("::warning::no merge-base to ratchet against; absolute findings are advisory", file=sys.stderr)
                  return 0
              rc = exit_code(reports, fail_on, gate=True)
              if rc == 1:
                  print("::error::agent-readiness regressions in a repo with \"enforce\": true "
                        f"— fix them, add a dated waiver, or flip enforce off in {CONFIG_FILE}", file=sys.stderr)
              return rc


          def main(argv: list[str]) -> int:
              ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
              ap.add_argument("--root", default=".", help="repo checkout to scan (default: cwd)")
              ap.add_argument("--name", help="repo name to report (default: directory name)")
              ap.add_argument("--fleet", help="scan every git repo directly under this directory")
              ap.add_argument("--baseline", help="JSON from a prior run; report only regressions")
              ap.add_argument("--ci", action="store_true", help="PR mode: merge-base ratchet + gate")
              ap.add_argument("--gate", action="store_true", help='fail only when the repo sets "enforce": true')
              ap.add_argument("--json", action="store_true", help="JSON report on stdout")
              ap.add_argument("--summary-md", help="write a markdown table to this file")
              ap.add_argument("--github-output", action="store_true")
              ap.add_argument("--quiet", action="store_true")
              ap.add_argument("--fail-on", choices=list(SEV_ORDER), default="medium",
                              help="lowest severity that sets a failing exit status (default: medium)")
              args = ap.parse_args(argv)

              root = Path(args.root)
              if args.ci:
                  if not (root / ".git").exists():
                      print(f"{root} is not a git checkout", file=sys.stderr)
                      return 2
                  return run_ci(root, args.fail_on)
              if args.fleet:
                  roots = fleet_roots(Path(args.fleet))
                  if not roots:
                      print(f"no git repos under {args.fleet}", file=sys.stderr)
                      return 2
                  reports = [audit_repo(r) for r in roots]
              else:
                  if not (root / ".git").exists():
                      print(f"{root} is not a git checkout", file=sys.stderr)
                      return 2
                  reports = [audit_repo(root, args.name)]

              ratchet = False
              if args.baseline:
                  try:
                      with open(args.baseline, encoding="utf-8") as fh:
                          baseline = json.load(fh)
                  except (OSError, ValueError) as exc:
                      print(f"baseline unreadable: {exc}", file=sys.stderr)
                      return 2
                  reports, ratchet = apply_baseline(reports, baseline), True

              if not args.quiet:
                  print(render_human(reports, ratchet), file=sys.stderr)
              if args.json:
                  print(json.dumps(to_json(reports), indent=2))
              if args.summary_md:
                  Path(args.summary_md).write_text(render_markdown(reports, ratchet), encoding="utf-8")
              if args.github_output:
                  write_github_output(reports)
              return exit_code(reports, args.fail_on, args.gate)


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY
          python3 "${RUNNER_TEMP}/agent_readiness.py" --ci --root .
