name: Auto-bump plugin versions

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-bump-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Never run on bot's own bump commits — avoids infinite loop. Also require the PR
    # head to be a same-repo branch (not a fork) before granting the contents:write push.
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history so we can diff against the base branch
          fetch-depth: 0
          # Use the PR head ref so we can push back to it
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed plugins and bump versions
        id: bump
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          changed=0

          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            manifest="${plugin_dir}.claude-plugin/plugin.json"
            [ -f "$manifest" ] || continue

            # Check if any file inside this plugin changed
            if ! git diff --quiet "$BASE" "$HEAD" -- "$plugin_dir"; then
              # Get version on base branch vs current
              base_version=$(git show "$BASE:$manifest" 2>/dev/null | jq -r '.version // "0.0.0"')
              current_version=$(jq -r '.version' "$manifest")

              # Only bump the manifest if the developer hasn't already bumped it
              # themselves -- but keep SERVER_VERSION in sync either way (below):
              # this branch used to skip that sync entirely whenever a developer had
              # already touched the manifest, which is exactly how SERVER_VERSION
              # drifted from plugin.json in #107.
              if [ "$current_version" = "$base_version" ]; then
                # Increment patch: split on dot, bump third segment
                IFS='.' read -r major minor patch <<< "$current_version"
                new_version="${major}.${minor}.$((patch + 1))"

                echo "Bumping $plugin_name: $current_version -> $new_version"

                # Update plugin.json
                tmp=$(mktemp)
                jq --arg v "$new_version" '.version = $v' "$manifest" > "$tmp"
                mv "$tmp" "$manifest"

                # Update marketplace.json to match
                tmp=$(mktemp)
                jq --arg name "$plugin_name" --arg v "$new_version" \
                  '(.plugins[] | select(.name == $name) | .version) |= $v' \
                  .claude-plugin/marketplace.json > "$tmp"
                mv "$tmp" .claude-plugin/marketplace.json

                changed=1
              else
                new_version="$current_version"
                echo "$plugin_name already bumped ($base_version -> $current_version), skipping manifest bump"
              fi

              # Keep any hand-maintained SERVER_VERSION constant(s) under this plugin in
              # sync with $new_version -- runs unconditionally, whether this job just
              # bumped the manifest above or a developer already had. version-bump.yml
              # is otherwise the only writer of plugin.json/marketplace.json, so nothing
              # else keeps SERVER_VERSION from drifting. Matched by content rather than
              # an assumed filename, so this covers any script under the plugin dir that
              # declares the constant.
              while IFS= read -r script; do
                current_server_version=$(sed -n 's/^SERVER_VERSION = "\(.*\)"/\1/p' "$script")
                if [ "$current_server_version" != "$new_version" ]; then
                  echo "Syncing SERVER_VERSION in $script: $current_server_version -> $new_version"
                  sed -i "s/^SERVER_VERSION = \"[^\"]*\"/SERVER_VERSION = \"$new_version\"/" "$script"
                  grep -q "^SERVER_VERSION = \"$new_version\"" "$script" \
                    || { echo "::error file=$script::SERVER_VERSION not updated to $new_version"; exit 1; }
                  changed=1
                fi
              done < <(grep -rl --include='*.py' '^SERVER_VERSION = "' "$plugin_dir" || true)
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit version bumps
        if: steps.bump.outputs.changed == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u -- plugins .claude-plugin
          git commit -m "chore: auto-bump plugin versions"
          git push origin "HEAD:${{ github.head_ref }}"
