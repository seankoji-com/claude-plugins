# Code Review Matrix — synced from seankoji-com/.github (panel/call-reusable-parallel-review.yml)
name: Code Review Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Org/repo default_workflow_permissions is "read" fleet-wide, so a reusable-workflow
# caller that omits `permissions:` inherits read-only — and reusable-parallel-review.yml's
# matrix-review job requests `pull-requests: read`, which exceeds that. Without this block
# every call fails at resolution time (conclusion: startup_failure, zero jobs, no check run —
# silent, not a visible failed check). Must grant at least what the callee's job requests.
# Note: the callee's job now uses pull-requests: read (not write) — OCR reads the diff
# but does not post. Posting is done by the persona's own App token. The write permission
# here is kept for forward compatibility and is harmless.
permissions:
  contents: read
  pull-requests: write

# Two pushes to the same PR in quick succession otherwise start two
# overlapping runs of this workflow — both read the PR's existing review
# comments before either has posted (incremental mode's dedup check), so both
# post the same "new" findings. cancel-in-progress means only the run against
# the latest push ever finishes.
concurrency:
  group: code-review-matrix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  parallel-review:
    uses: seankoji-com/.github/.github/workflows/reusable-parallel-review.yml@main
    secrets:
      # OpenRouter API key for the review LLM calls (org secret). The personas
      # run on `openrouter/free`, OpenRouter's Free Models Router.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # mm-solution-architect: used for .github private repo checkout (read-only)
      MM_SOLUTION_ARCHITECT_APP_ID: ${{ secrets.MM_SOLUTION_ARCHITECT_APP_ID }}
      MM_SOLUTION_ARCHITECT_PRIVATE_KEY: ${{ secrets.MM_SOLUTION_ARCHITECT_PRIVATE_KEY }}
      # Per-persona GitHub App credentials: each persona posts under its own App identity.
      MM_GRUMPY_ENGINEER_APP_ID: ${{ secrets.MM_GRUMPY_ENGINEER_APP_ID }}
      MM_GRUMPY_ENGINEER_PRIVATE_KEY: ${{ secrets.MM_GRUMPY_ENGINEER_PRIVATE_KEY }}
      MM_SRE_APP_ID: ${{ secrets.MM_SRE_APP_ID }}
      MM_SRE_PRIVATE_KEY: ${{ secrets.MM_SRE_PRIVATE_KEY }}
      MM_UX_DESIGNER_APP_ID: ${{ secrets.MM_UX_DESIGNER_APP_ID }}
      MM_UX_DESIGNER_PRIVATE_KEY: ${{ secrets.MM_UX_DESIGNER_PRIVATE_KEY }}
      MM_BUSINESS_ANALYST_APP_ID: ${{ secrets.MM_BUSINESS_ANALYST_APP_ID }}
      MM_BUSINESS_ANALYST_PRIVATE_KEY: ${{ secrets.MM_BUSINESS_ANALYST_PRIVATE_KEY }}
