# OpenCode greenkeeper signal — synced from seankoji-com/.github (panel/call-reusable-opencode-greenkeeper.yml)
# Asks the private controller to look at one same-repository, non-draft pull
# request. Passes the optional app private key. Does not check out pull-request
# code. Repair stays off until OPENCODE_GREENKEEPER_MODE is set on
# seankoji-com/.github-private.
name: OpenCode greenkeeper signal

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ['*']
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# Coalesce the signal per PR. A superseded signal has no value: the controller
# reads the PR's current state when it acts. The workflow_run branch on a
# main-branch run has no PR number, so it falls back to the unique run id and is
# never cancelled.
concurrency:
  group: >-
    opencode-greenkeeper-${{
    github.event.pull_request.number ||
    github.event.workflow_run.pull_requests[0].number ||
    github.run_id }}
  cancel-in-progress: true

jobs:
  signal:
    if: >-
      (
        (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review') &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_run' &&
        (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
        github.event.workflow_run.name != 'OpenCode greenkeeper signal' &&
        github.event.workflow_run.name != 'PR Gatekeeper' &&
        github.event.workflow_run.pull_requests[0].number > 0
      )
    uses: seankoji-com/.github/.github/workflows/reusable-opencode-greenkeeper-signal.yml@main
    secrets:
      app_private_key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
    with:
      runner-json: '["ubuntu-latest"]'
